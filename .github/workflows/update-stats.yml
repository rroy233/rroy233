name: Generate GitHub Readme Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Generate Profile Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=rroy233&theme=radical&no-frame=true&no-bg=true&margin-w=15'
          path: profile/trophy.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=rroy233&show_icons=true&theme=radical&count_private=true&include_all_commits=true&hide_border=true&bg_color=0D1117&text_color=C9D1D9&icon_color=58A6FF&title_color=58A6FF
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Langs Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=rroy233&layout=compact&theme=radical&hide_border=true&bg_color=0D1117&text_color=C9D1D9&title_color=58A6FF
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download Additional Images
        run: |
          mkdir -p profile
          # 顶部欢迎动画 (Header)
          curl -s -o profile/header.svg "https://capsule-render.vercel.app/api?type=waving&color=timeGradient&height=250&section=header&text=Hi%20there,%20I'm%20Roy%20👋&fontSize=50&fontAlignY=35&animation=twinkling&fontColor=ffffff"
          
          # 打字机动画
          curl -s -o profile/typing.svg "https://readme-typing-svg.demolab.com?font=Fira+Code&weight=500&size=20&duration=3000&pause=1000&color=36BCF7&center=true&vCenter=true&width=600&lines=Building+Scalable+Backend+Services+with+Go;Exploring+Cloud-Native+%26+Distributed+Systems"
          
          # 连续贡献打卡
          curl -s -o profile/streak.svg "https://github-readme-streak-stats.herokuapp.com/?user=rroy233&theme=radical&hide_border=true&background=0D1117&ring=58A6FF&fire=58A6FF&currStreakLabel=C9D1D9"
          
          # 下载动态贡献曲线
          curl -s -o profile/activity.svg "https://github-readme-activity-graph-sable-two.vercel.app/graph?username=rroy233&theme=react-dark&bg_color=0D1117&color=58A6FF&line=36BCF7&point=FFFFFF&hide_border=true&height=250"

      - name: Commit and Push Cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "update github readme stats and sync images" || exit 0
          git push
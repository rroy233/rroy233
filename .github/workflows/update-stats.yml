name: Generate GitHub Readme Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Generate Profile Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=rroy233&theme=pastel&no-frame=true&no-bg=true&margin-w=15'
          path: profile/trophy.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=rroy233&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&bg_color=ffffff&title_color=36BCF7&icon_color=B392F0&text_color=434d58
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Langs Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=rroy233&layout=compact&hide_border=true&bg_color=ffffff&title_color=36BCF7&text_color=434d58
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download Additional Images
        run: |
          mkdir -p profile
          curl -s -o profile/header.svg "https://capsule-render.vercel.app/api?type=waving&color=timeGradient&height=250&section=header&text=Hi%20there,%20I'm%20Roy%20👋&fontSize=50&fontAlignY=35&animation=twinkling&fontColor=ffffff"
          
          curl -s -o profile/typing.svg "https://readme-typing-svg.demolab.com?font=Fira+Code&weight=500&size=20&duration=3000&pause=1000&color=36BCF7&center=true&vCenter=true&width=600&lines=Building+Scalable+Backend+Services+with+Go;Exploring+Cloud-Native+%26+Distributed+Systems"
          
          curl -s -o profile/streak.svg "https://github-readme-streak-stats.herokuapp.com/?user=rroy233&hide_border=true&background=ffffff&ring=B392F0&fire=FF9ECD&currStreakLabel=434d58&currStreakNum=36BCF7&sideNums=434d58&sideLabels=434d58&dates=434d58"
          
          curl -s -o profile/activity.svg "https://github-readme-activity-graph-sable-two.vercel.app/graph?username=rroy233&bg_color=ffffff&color=434d58&line=36BCF7&point=B392F0&hide_border=true&height=250"

      - name: Commit and Push Cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "update github readme stats and sync images" || exit 0
          git push